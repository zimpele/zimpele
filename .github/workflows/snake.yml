# Draws the contribution graph as a pond: a gold koi eats the contribution dots.
name: Koi snake

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

concurrency: snake

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#f2994a&color_dots=#e3f1f4,#9ae6f0,#3fb6c9,#1b6f8f,#0b3d5c
            dist/snake-dark.svg?color_snake=#f2c14e&color_dots=#0e2433,#0f4c5c,#1b7f8f,#3fb6c9,#9ae6f0
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
