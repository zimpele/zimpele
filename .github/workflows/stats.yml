# Redraws assets/stats.svg (contributions, streaks, last 12 weeks) every night.
name: Pond stats

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/stats.yml, scripts/stats.py]

permissions:
  contents: write

concurrency: stats

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Draw the stats card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stats.py "${{ github.repository_owner }}" assets/stats.svg
      - name: Commit the stats card if it changed
        run: |
          git add assets/stats.svg
          if git diff --cached --quiet; then
            echo "Stats unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "stats: redraw the pond stats"
          git pull --quiet --rebase
          git push --quiet
