<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Hey, I'm Luca. Full-Stack Web Developer and AI Engineer">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0c3b52"/>
      <stop offset="0.55" stop-color="#082636"/>
      <stop offset="1" stop-color="#04131d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#3fb6c9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3fb6c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ae6f0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f2994a"/>
    </linearGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>

    <!-- koi, facing right, ~170 long -->
    <g id="koiGold">
      <g>
        <path d="M-58,0 C-72,-6 -88,-22 -102,-26 C-94,-10 -94,10 -102,26 C-88,22 -72,6 -58,0 Z" fill="#ffd98a" opacity="0.85">
          <animateTransform attributeName="transform" type="rotate" values="-14 -58 0;14 -58 0;-14 -58 0" dur="1.1s" repeatCount="indefinite"/>
        </path>
      </g>
      <path d="M26,12 C20,28 6,36 -4,34 C6,26 12,18 14,12 Z" fill="#ffe2a6" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0 18 12;10 18 12;0 18 12" dur="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M26,-12 C20,-28 6,-36 -4,-34 C6,-26 12,-18 14,-12 Z" fill="#ffe2a6" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0 18 -12;-10 18 -12;0 18 -12" dur="1.1s" repeatCount="indefinite"/>
      </path>
      <path d="M64,0 C56,-17 26,-23 -6,-19 C-32,-15 -50,-7 -62,0 C-50,7 -32,15 -6,19 C26,23 56,17 64,0 Z" fill="#f7c04a"/>
      <ellipse cx="22" cy="-4" rx="16" ry="8" fill="#e8692e" opacity="0.9"/>
      <ellipse cx="-14" cy="5" rx="13" ry="7" fill="#e8692e" opacity="0.85"/>
      <ellipse cx="-38" cy="-2" rx="8" ry="4" fill="#e8692e" opacity="0.8"/>
      <path d="M50,-4 C40,-10 10,-12 -30,-6" stroke="#fff3cf" stroke-width="2" fill="none" opacity="0.6"/>
      <circle cx="52" cy="-8" r="2.4" fill="#1b1b1b"/>
      <circle cx="52" cy="8" r="2.4" fill="#1b1b1b"/>
    </g>
    <g id="koiWhite">
      <path d="M-58,0 C-72,-6 -88,-22 -102,-26 C-94,-10 -94,10 -102,26 C-88,22 -72,6 -58,0 Z" fill="#ffffff" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" values="12 -58 0;-12 -58 0;12 -58 0" dur="1.4s" repeatCount="indefinite"/>
      </path>
      <path d="M26,12 C20,28 6,36 -4,34 C6,26 12,18 14,12 Z M26,-12 C20,-28 6,-36 -4,-34 C6,-26 12,-18 14,-12 Z" fill="#ffffff" opacity="0.7"/>
      <path d="M64,0 C56,-17 26,-23 -6,-19 C-32,-15 -50,-7 -62,0 C-50,7 -32,15 -6,19 C26,23 56,17 64,0 Z" fill="#f4f7f8"/>
      <ellipse cx="40" cy="0" rx="14" ry="9" fill="#e0402a"/>
      <ellipse cx="-10" cy="-6" rx="15" ry="7" fill="#e0402a" opacity="0.9"/>
      <circle cx="52" cy="-8" r="2.4" fill="#1b1b1b"/>
      <circle cx="52" cy="8" r="2.4" fill="#1b1b1b"/>
    </g>

    <g id="pad">
      <path d="M0,0 L37.6,13.7 A40,40 0 1 1 37.6,-13.7 Z" fill="#2f8a57"/>
      <path d="M0,0 L-38,4 M0,0 L-20,-34 M0,0 L-14,36 M0,0 L20,-34 M0,0 L22,32" stroke="#57b07c" stroke-width="1.6" opacity="0.7"/>
      <path d="M0,0 L37.6,13.7 A40,40 0 1 1 37.6,-13.7 Z" fill="none" stroke="#1f6a40" stroke-width="2"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#water)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- caustic light -->
    <g filter="url(#blur30)" opacity="0.55">
      <ellipse cx="300" cy="80" rx="180" ry="50" fill="#1f8aa0">
        <animateTransform attributeName="transform" type="translate" values="0 0;120 30;0 0" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="900" cy="300" rx="220" ry="60" fill="#14708a">
        <animateTransform attributeName="transform" type="translate" values="0 0;-140 -20;0 0" dur="22s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="620" cy="190" rx="140" ry="40" fill="#2aa3b8">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="9s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- deep koi (blurred, under everything) -->
    <g filter="url(#blur3)" opacity="0.45">
      <use href="#koiWhite" transform="scale(0.8)">
        <animateMotion dur="30s" repeatCount="indefinite" rotate="auto" path="M1400,90 C1100,40 900,170 650,120 S250,30 -200,140"/>
      </use>
    </g>

    <!-- ripples -->
    <g fill="none" stroke="#9ae6f0">
      <circle cx="960" cy="120" r="10" stroke-width="2">
        <animate attributeName="r" values="10;90" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="120" r="10" stroke-width="2">
        <animate attributeName="r" values="10;90" dur="5s" begin="2.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.01;1" dur="5s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1090" cy="275" r="8" stroke-width="1.6">
        <animate attributeName="r" values="8;70" dur="6s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0" dur="6s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="430" cy="320" r="6" stroke-width="1.4">
        <animate attributeName="r" values="6;60" dur="7s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.4;0" dur="7s" begin="3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- swimming gold koi -->
    <g filter="url(#shadow)">
      <use href="#koiGold" transform="scale(0.9)">
        <animateMotion dur="24s" repeatCount="indefinite" rotate="auto" path="M-200,330 C150,380 420,300 700,325 S1010,360 1080,210 S900,40 1400,-60"/>
      </use>
    </g>

    <!-- lily pads + lotus -->
    <g filter="url(#shadow)">
      <g transform="translate(1010,95) scale(1.35)">
        <use href="#pad"><animateTransform attributeName="transform" type="rotate" values="0;8;0" dur="10s" repeatCount="indefinite"/></use>
        <g transform="translate(-4,2)">
          <ellipse cx="0" cy="-12" rx="7" ry="16" fill="#f6a5c0" transform="rotate(-40)"/>
          <ellipse cx="0" cy="-12" rx="7" ry="16" fill="#f6a5c0" transform="rotate(40)"/>
          <ellipse cx="0" cy="-12" rx="7" ry="16" fill="#f6a5c0" transform="rotate(-110)"/>
          <ellipse cx="0" cy="-12" rx="7" ry="16" fill="#f6a5c0" transform="rotate(110)"/>
          <ellipse cx="0" cy="-12" rx="6" ry="15" fill="#fbd3e0" transform="rotate(-15)"/>
          <ellipse cx="0" cy="-12" rx="6" ry="15" fill="#fbd3e0" transform="rotate(15)"/>
          <ellipse cx="0" cy="-12" rx="6" ry="14" fill="#fde4ec" transform="rotate(180)"/>
          <circle r="5" fill="#ffd27a"/>
        </g>
      </g>
      <g transform="translate(1120,260) rotate(140)">
        <use href="#pad"><animateTransform attributeName="transform" type="rotate" values="0;-10;0" dur="12s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(870,330) rotate(-60) scale(0.7)">
        <use href="#pad"><animateTransform attributeName="transform" type="rotate" values="0;12;0" dur="9s" repeatCount="indefinite"/></use>
      </g>
    </g>

    <!-- bubbles -->
    <g fill="none" stroke="#bdf2f8" stroke-width="1.4" opacity="0.7">
      <circle cx="120" cy="400" r="4"><animate attributeName="cy" values="400;-20" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="400" r="3"><animate attributeName="cy" values="400;-20" dur="11s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="400" r="5"><animate attributeName="cy" values="400;-20" dur="13s" begin="5s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="400" r="2.5"><animate attributeName="cy" values="400;-20" dur="8s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="400" r="3"><animate attributeName="cy" values="400;-20" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- text -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="80" y="96" font-size="18" font-weight="600" letter-spacing="6" fill="#3fb6c9">WELCOME TO MY POND</text>
      <text x="76" y="168" font-size="72" font-weight="800" fill="url(#titleGrad)">Hey, I'm Luca<tspan fill="#f2c14e">.</tspan></text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="80" y="218" font-size="26" font-weight="700" fill="url(#goldGrad)">Full-Stack Web Developer <tspan fill="#3fb6c9">|</tspan> AI Engineer</text>
      <text x="80" y="258" font-size="18" fill="#8fc3cf"><tspan fill="#3fb6c9">&gt;</tspan> building fast web apps &amp; teaching machines to help<tspan fill="#f2c14e">_<animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
    </g>

    <rect width="1200" height="380" rx="28" fill="none" stroke="#3fb6c9" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
