<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Hey, I'm Luca. Full-Stack Web Developer and AI Engineer">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0f4660"/>
      <stop offset="0.5" stop-color="#0a2b3d"/>
      <stop offset="1" stop-color="#04121b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#5fd0de" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5fd0de" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff4fb" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#bff4fb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="76" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c8f3f8"/>
      <stop offset="1" stop-color="#7fd9e6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;300 0;0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#f29a4a"/>
    </linearGradient>
    <radialGradient id="goldBody" cx="0.55" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.45" stop-color="#f9c650"/>
      <stop offset="1" stop-color="#e0932a"/>
    </radialGradient>
    <radialGradient id="spot" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="1" stop-color="#d6461b"/>
    </radialGradient>
    <linearGradient id="fin" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe7a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="whiteBody" cx="0.55" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfdde2"/>
    </radialGradient>
    <radialGradient id="padGrad" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#5cbf7f"/>
      <stop offset="0.7" stop-color="#2f8a57"/>
      <stop offset="1" stop-color="#1f6a40"/>
    </radialGradient>
    <radialGradient id="padGrad2" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8acb6a"/>
      <stop offset="1" stop-color="#3f7d3a"/>
    </radialGradient>

    <filter id="caustics" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.75  0 0 0 0 0.95  0 0 0 0 1  0 0 0 9 -4.6"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="deep" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="200%"><feDropShadow dx="6" dy="12" stdDeviation="7" flood-color="#00080d" flood-opacity="0.55"/></filter>
    <clipPath id="card"><rect width="1200" height="380" rx="28"/></clipPath>

    <!-- gold koi, facing right -->
    <g id="koiGold">
      <path d="M-56,0 C-70,-5 -86,-20 -104,-28 C-95,-12 -95,12 -104,28 C-86,20 -70,5 -56,0 Z" fill="url(#fin)">
        <animateTransform attributeName="transform" type="rotate" values="-16 -56 0;16 -56 0;-16 -56 0" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <g fill="url(#fin)">
        <path d="M24,12 C20,30 4,40 -8,38 C2,28 10,19 12,12 Z">
          <animateTransform attributeName="transform" type="rotate" values="0 18 12;12 18 12;0 18 12" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <path d="M24,-12 C20,-30 4,-40 -8,-38 C2,-28 10,-19 12,-12 Z">
          <animateTransform attributeName="transform" type="rotate" values="0 18 -12;-12 18 -12;0 18 -12" dur="1.2s" repeatCount="indefinite"/>
        </path>
        <path d="M-30,8 C-34,18 -44,22 -50,20 C-44,15 -40,10 -40,6 Z M-30,-8 C-34,-18 -44,-22 -50,-20 C-44,-15 -40,-10 -40,-6 Z" opacity="0.8"/>
      </g>
      <path d="M66,0 C60,-16 32,-22 0,-19 C-28,-16 -46,-8 -60,0 C-46,8 -28,16 0,19 C32,22 60,16 66,0 Z" fill="url(#goldBody)"/>
      <path d="M44,-9 C30,-15 16,-12 18,-3 C22,6 40,4 46,-2 Z" fill="url(#spot)"/>
      <path d="M2,4 C-10,0 -24,6 -22,13 C-18,18 0,15 6,10 Z" fill="url(#spot)"/>
      <ellipse cx="-36" cy="-3" rx="9" ry="4.5" fill="url(#spot)"/>
      <path d="M56,-3 C40,-8 10,-9 -40,-2" stroke="#fff6d6" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.65"/>
      <circle cx="54" cy="-8" r="2.6" fill="#1a1205"/>
      <circle cx="54" cy="8" r="2.6" fill="#1a1205"/>
      <path d="M64,-3 L70,-6 M64,3 L70,6" stroke="#e0932a" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <!-- kohaku koi (white + red) -->
    <g id="koiWhite">
      <path d="M-56,0 C-70,-5 -86,-20 -104,-28 C-95,-12 -95,12 -104,28 C-86,20 -70,5 -56,0 Z" fill="#ffffff" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" values="14 -56 0;-14 -56 0;14 -56 0" dur="1.5s" repeatCount="indefinite"/>
      </path>
      <path d="M24,12 C20,30 4,40 -8,38 C2,28 10,19 12,12 Z M24,-12 C20,-30 4,-40 -8,-38 C2,-28 10,-19 12,-12 Z" fill="#ffffff" opacity="0.6"/>
      <path d="M66,0 C60,-16 32,-22 0,-19 C-28,-16 -46,-8 -60,0 C-46,8 -28,16 0,19 C32,22 60,16 66,0 Z" fill="url(#whiteBody)"/>
      <path d="M58,-6 C48,-13 30,-10 32,0 C34,9 50,8 58,4 Z" fill="#e0402a"/>
      <path d="M10,-14 C-6,-12 -22,-4 -18,4 C-12,8 6,2 14,-6 Z" fill="#e0402a"/>
      <circle cx="54" cy="-8" r="2.6" fill="#1b1b1b"/>
      <circle cx="54" cy="8" r="2.6" fill="#1b1b1b"/>
    </g>

    <g id="pad">
      <path d="M0,0 L37.6,13.7 A40,40 0 1 1 37.6,-13.7 Z" fill="url(#padGrad)"/>
      <path d="M0,0 L-38,4 M0,0 L-24,-31 M0,0 L-16,36 M0,0 L16,-36 M0,0 L28,28 M0,0 L-36,-16 M0,0 L-34,20" stroke="#8fd8a6" stroke-width="1.2" opacity="0.45"/>
      <path d="M0,0 L37.6,13.7 A40,40 0 1 1 37.6,-13.7 Z" fill="none" stroke="#1a5a36" stroke-width="2.2"/>
      <path d="M-30,-22 A37,37 0 0 1 10,-36" fill="none" stroke="#b9f0c9" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </g>
    <g id="lotus">
      <ellipse cx="0" cy="-13" rx="7.5" ry="17" fill="#ef8fb0" transform="rotate(-72)"/>
      <ellipse cx="0" cy="-13" rx="7.5" ry="17" fill="#ef8fb0" transform="rotate(72)"/>
      <ellipse cx="0" cy="-13" rx="7.5" ry="17" fill="#f39cba" transform="rotate(-144)"/>
      <ellipse cx="0" cy="-13" rx="7.5" ry="17" fill="#f39cba" transform="rotate(144)"/>
      <ellipse cx="0" cy="-13" rx="7" ry="16" fill="#f8b9cf" transform="rotate(-36)"/>
      <ellipse cx="0" cy="-13" rx="7" ry="16" fill="#f8b9cf" transform="rotate(36)"/>
      <ellipse cx="0" cy="-13" rx="7" ry="16" fill="#f8b9cf" transform="rotate(180)"/>
      <ellipse cx="0" cy="-10" rx="5.5" ry="13" fill="#fde3ec" transform="rotate(-12)"/>
      <ellipse cx="0" cy="-10" rx="5.5" ry="13" fill="#fde3ec" transform="rotate(12)"/>
      <circle r="5.5" fill="#ffd27a"/>
      <circle r="2.5" fill="#f2a93b"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#water)"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- light rays -->
    <g>
      <path d="M760,-10 L860,-10 L640,400 L520,400 Z" fill="url(#ray)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M930,-10 L990,-10 L820,400 L740,400 Z" fill="url(#ray)">
        <animate attributeName="opacity" values="1;0.3;1" dur="9s" repeatCount="indefinite"/>
      </path>
      <path d="M1080,-10 L1170,-10 L1010,400 L900,400 Z" fill="url(#ray)" opacity="0.7">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- caustic shimmer -->
    <g opacity="0.06">
      <rect x="-200" y="0" width="1600" height="380" filter="url(#caustics)">
        <animateTransform attributeName="transform" type="translate" values="0 0;160 -20;0 0" dur="40s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g filter="url(#soft)" opacity="0.5">
      <ellipse cx="900" cy="300" rx="220" ry="60" fill="#14708a">
        <animateTransform attributeName="transform" type="translate" values="0 0;-140 -20;0 0" dur="22s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <rect width="1200" height="380" fill="url(#vignette)"/>

    <!-- deep kohaku -->
    <g filter="url(#deep)" opacity="0.38">
      <use href="#koiWhite" transform="scale(0.75)">
        <animateMotion dur="34s" repeatCount="indefinite" rotate="auto" path="M1450,260 C1200,320 960,250 860,150 S700,30 420,38 S120,50 -260,30"/>
      </use>
    </g>

    <!-- ripples around the pads -->
    <g fill="none" stroke="#bff4fb">
      <circle cx="1010" cy="95" r="58" stroke-width="1.6">
        <animate attributeName="r" values="58;130" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0" dur="6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="95" r="58" stroke-width="1.6" opacity="0">
        <animate attributeName="r" values="58;130" dur="6s" begin="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0" dur="6s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="262" r="42" stroke-width="1.3">
        <animate attributeName="r" values="42;95" dur="7s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.35;0" dur="7s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- swimming gold koi -->
    <g filter="url(#shadow)">
      <use href="#koiGold" transform="scale(0.95)">
        <animateMotion dur="26s" repeatCount="indefinite" rotate="auto" path="M-220,330 C150,375 420,305 700,325 S1010,360 1075,215 S920,40 1450,-80"/>
      </use>
    </g>

    <!-- lily pads + lotus -->
    <g filter="url(#shadow)">
      <g transform="translate(1010,95) scale(1.4)">
        <use href="#pad"><animateTransform attributeName="transform" type="rotate" values="0;7;0" dur="10s" repeatCount="indefinite"/></use>
        <use href="#lotus" transform="translate(-4,2)"/>
      </g>
      <g transform="translate(1120,262) rotate(140)">
        <use href="#pad"><animateTransform attributeName="transform" type="rotate" values="0;-9;0" dur="12s" repeatCount="indefinite"/></use>
      </g>
      <g transform="translate(872,330) rotate(-60) scale(0.72)">
        <path d="M0,0 L37.6,13.7 A40,40 0 1 1 37.6,-13.7 Z" fill="url(#padGrad2)" stroke="#2d5e2a" stroke-width="2">
          <animateTransform attributeName="transform" type="rotate" values="0;12;0" dur="9s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(1160,40) scale(0.55)">
        <use href="#lotus" opacity="0.95"><animateTransform attributeName="transform" type="rotate" values="-6;6;-6" dur="8s" repeatCount="indefinite"/></use>
      </g>
    </g>

    <!-- drifting petal -->
    <ellipse rx="5" ry="2.6" fill="#f8b9cf" opacity="0.9">
      <animateMotion dur="28s" repeatCount="indefinite" rotate="auto" path="M1220,180 C1100,210 980,170 900,215 S760,250 640,230"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.8;1" dur="28s" repeatCount="indefinite"/>
    </ellipse>

    <!-- bubbles (right side only) -->
    <g fill="none" stroke="#d6f8fc" stroke-width="1.3">
      <circle cx="905" cy="400" r="3.5"><animate attributeName="cy" values="400;-20" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="915" cy="400" r="2"><animate attributeName="cy" values="400;-20" dur="10s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="1175" cy="400" r="3"><animate attributeName="cy" values="400;-20" dur="12s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="12s" begin="4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- text -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="80" y="104" font-size="17" font-weight="700" letter-spacing="6" fill="#5fd0de">WELCOME TO MY POND</text>
      <text x="76" y="178" font-size="74" font-weight="800" letter-spacing="-1" fill="url(#titleGrad)">Hey, I'm Luca<tspan fill="#f2c14e">.</tspan></text>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="80" y="226" font-size="26" font-weight="700" fill="url(#goldText)">Full-Stack Web Developer <tspan fill="#5fd0de">|</tspan> AI Engineer</text>
      <text x="80" y="266" font-size="18" fill="#9fcfd9"><tspan fill="#5fd0de">&gt;</tspan> building fast web apps &amp; teaching machines to help<tspan fill="#f2c14e">_<animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#5fd0de" stroke-opacity="0.22" stroke-width="2"/>
</svg>
